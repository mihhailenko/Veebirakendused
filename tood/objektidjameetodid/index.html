<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Raamat ja raamatukogu</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
<h1>JS: Objektid ja meetodid</h1>
<p>Tulemused kuvatakse ka konsoolisse</p>

<section id="raamat">
    <h2>Minu oma raamat</h2>
    <input type="button" value="Raamatu kirjeldus" onclick="raamat.kuvaKirjeldus()">
    <div id="vastus1"></div>
    <br>
    <!-- новый год выпуска (книги) -->
    <label for="uusAasta">Uus väljaandmise aasta:</label>
    <input type="number" id="uusAasta" min="1" max="9999" step="1" value="2026">
    <input type="button" value="Muuda aastat" onclick="raamat.muudaAasta()">
    <div id="vastus2"></div>
</section>

<section id="raamatukogu">
    <h2>Raamatukogu</h2>
    <input type="button" value="Kuva kõik raamatud" onclick="raamatukogu.kuvaRaamatud()">
    <div id="vastus3"></div>

    <h3>Lisa uus raamat</h3>
    <label for="pealkiri">Pealkiri:</label>
    <input type="text" id="pealkiri">
    <br>
    <label for="autor">Autor:</label>
    <input type="text" id="autor">
    <br>
    <label for="aasta">Aasta:</label>
    <input type="number" id="aasta" min="1" max="9999" step="1">
    <br>
    <input type="button" value="Lisa raamat" onclick="raamatukogu.lisaRaamat()">
    <div id="vastus4"></div>
    <br>

    <input type="button" value="Raamatute koguarv" onclick="raamatukogu.raamatuteArv()">
    <div id="vastus5"></div>
    <br>
    <input type="button" value="Pärast 2000. aastat" onclick="raamatukogu.parast2000()">
    <div id="vastus6"></div>

    <h3>Minu meetod: raamatu otsimine</h3>
    <p>otsiRaamat() otsib raamatut pealkirja järgi ja kuvab selle autori ning aasta.</p>
    <label for="otsing">Raamatu pealkiri:</label>
    <input type="text" id="otsing">
    <input type="button" value="Otsi raamatut" onclick="raamatukogu.otsiRaamat()">
    <div id="vastus7"></div>
</section>

</body>
</html>
