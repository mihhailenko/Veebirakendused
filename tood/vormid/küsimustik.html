<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Muusika küsimustik</title>
</head>
<body>
<h1>Muusika küsimustik</h1>
<div>HTML vormid ja nupud</div>
<form action="#">
    <!-- c + tab = komentaar -->
    <label for="nimi">Nimi:</label>
    <input type="text" id="nimi"  placeholder="Sisesta oma nimi">
    <br>
    <!-- ripploend või rippmenüü -->
    <label for="stiil">Millist muusikat kuulad?</label>
    <select id="stiil">
        <option value="vali">vali...</option>
        <option value="hiphop">Hiphop</option>
        <option value="pop">Pop</option>
        <option value="rock">Rock</option>
        <option value="klassikaline">Klassikaline</option>
        <option value="jazz">Jazz</option>
        <option value="metal">Metal</option>
    </select>
</form>
</body>
</html>
