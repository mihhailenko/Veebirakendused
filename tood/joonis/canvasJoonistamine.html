<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Canvas joonistamine</title>
    <script src="canvasScript.js"></script>
    <link rel="stylesheet" href="canvasStyle.css">
</head>
<body>
<h1>Joonistusrakendus Canvas + js</h1>
<canvas id="canvas" width="300" height="400"></canvas>
<table>
    <tr>
        <td>
            <input type="button" value="joon" onclick="joon()">
        </td>
        <td>
            <input type="button" value="puhasta" onclick="puhasta()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="kolmnurk" onclick="kolmnurk()">
        </td>
        <td>
            <input type="button" value="ristkülik" onclick="ristkylik()">
            <label for="laius">Laius:</label>
            <input type="number" id="laius" min="1" max="50" value="2" onchange="ristkylik()">
            <label for="kõrgus">Kõrgus:</label>
            <input type="number" id="kõrgus" min="1" max="50" value="2" onchange="ristkylik()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="ring" onclick="ring()">
            <label for="raadius">Raadius:</label>
            <input type="number" id="raadius" min="1" max="50" value="2" onchange="ring()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="joonista pilt" onclick="pilt()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="Ratas1" onclick="ratas1()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="Ratas2" onclick="ratas2()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="Kere" onclick="kere()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="Tuled" onclick="tuled()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="Aken" onclick="aken()">
        </td>
    </tr>
</table>
</body>
</html>
